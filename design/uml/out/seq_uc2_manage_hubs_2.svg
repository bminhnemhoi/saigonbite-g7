<text x="103.1" y="495.0" class="m"><tspan class="n">6</tspan> POST</text>
<text x="116.7" y="516.0" class="m">/admin/hubs/{id}/deactivate</text>
<line x1="93.1" y1="523.0" x2="341.1" y2="523.0" class="ln" marker-end="url(#solid)"/>
<text x="357.1" y="552.0" class="m"><tspan class="n">7</tspan> Deactivate(id)</text>

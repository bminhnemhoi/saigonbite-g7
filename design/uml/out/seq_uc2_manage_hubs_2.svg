<text x="605.1" y="811.0" class="m"><tspan class="n">11</tspan> UPDATE Hub SET IsActive =</text>
<text x="627.9" y="832.0" class="m">0</text>
<line x1="595.1" y1="839.0" x2="837.1" y2="839.0" class="ln" marker-end="url(#solid)"/>
<text x="363.1" y="868.0" class="m"><tspan class="n">12</tspan> ok</text>
<line x1="583.1" y1="875.0" x2="347.1" y2="875.0" class="ln" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="109.1" y="904.0" class="m"><tspan class="n">13</tspan> hub shown as Inactive;</text>
<text x="131.9" y="925.0" class="m">history and R2 kept</text>
<line x1="335.1" y1="932.0" x2="93.1" y2="932.0" class="ln" stroke-dasharray="7 5" marker-end="url(#open)"/>
